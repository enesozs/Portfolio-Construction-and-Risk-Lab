[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "portlab"
version = "0.1.0"
description = "Portfolio construction, risk and allocation research library and API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=1.0",
]

[project.optional-dependencies]
api = ["fastapi[standard]>=0.143"]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "playwright>=1.50",
]

[tool.fastapi]
entrypoint = "portlab_api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/portlab", "src/portlab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live Yahoo Finance data (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
# En dashes are intentional in names like "Black–Litterman".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "../e2e"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
